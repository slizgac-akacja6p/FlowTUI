[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowtui"
version = "0.1.0"
description = "Terminal Development Orchestrator — AI CLI orchestration TUI"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.50",
    "pydantic>=2.0",
    "watchdog>=4.0",
    "filelock>=3.0",
    "click>=8.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
flowtui = "flowtui.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["flowtui"]
